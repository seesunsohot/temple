<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>산속의 절</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#2a1d1a;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;touch-action:none;user-select:none;-webkit-user-select:none}
  canvas{display:block}
  #place{position:fixed;top:max(12px,env(safe-area-inset-top));left:50%;transform:translateX(-50%);color:#fff6e6;font-size:13px;letter-spacing:.3em;padding:5px 14px;background:rgba(40,25,20,.35);border-radius:20px;text-shadow:0 1px 3px rgba(0,0,0,.5);pointer-events:none}
  #sound{position:fixed;top:max(10px,env(safe-area-inset-top));right:12px;width:42px;height:42px;border-radius:50%;border:1px solid rgba(255,240,220,.5);background:rgba(40,25,20,.45);color:#fff;font-size:19px;cursor:pointer}
  #pad{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom));width:156px;height:156px;display:grid;grid-template:repeat(3,52px)/repeat(3,52px)}
  #pad button{width:48px;height:48px;margin:2px;border-radius:12px;border:1px solid rgba(255,240,220,.45);background:rgba(40,30,25,.4);color:#fff6e6;font-size:20px;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
  #pad button.on{background:rgba(255,240,220,.45)}
  #sit{position:fixed;right:16px;bottom:calc(60px + env(safe-area-inset-bottom));padding:12px 28px;font-size:17px;border-radius:24px;border:1px solid #f3d9a8;background:rgba(120,60,30,.8);color:#fff6e6;display:none;cursor:pointer;letter-spacing:.2em}
  #hint{position:fixed;bottom:12px;right:14px;color:rgba(255,240,220,.6);font-size:11px;pointer-events:none}
</style>
</head>
<body>
<div id="place">산속의 절</div>
<button id="sound" aria-label="소리 켜기/끄기">🔊</button>
<div id="pad">
  <span></span><button data-k="ArrowUp" aria-label="위">▲</button><span></span>
  <button data-k="ArrowLeft" aria-label="왼쪽">◀</button><span></span><button data-k="ArrowRight" aria-label="오른쪽">▶</button>
  <span></span><button data-k="ArrowDown" aria-label="아래">▼</button><span></span>
</div>
<button id="sit">앉기</button>
<div id="hint">WASD · 방향키로 이동</div>

<script type="importmap">
{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }
</script>
<script type="module">
import * as THREE from 'three';

// ---------- 렌더러 / 씬 ----------
const isTouch = matchMedia('(pointer:coarse)').matches || 'ontouchstart' in window;
const renderer = new THREE.WebGLRenderer({ antialias: !isTouch });
renderer.setPixelRatio(Math.min(devicePixelRatio, isTouch ? 1.5 : 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const FOG = new THREE.Color(0x8e8c8a);
scene.fog = new THREE.Fog(FOG, 15, 80);

// 하늘 그라데이션
{
  const c = document.createElement('canvas'); c.width = 2; c.height = 256;
  const g = c.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, 256);
  gr.addColorStop(0, '#3a3e48'); gr.addColorStop(0.5, '#6a6e78'); gr.addColorStop(0.75, '#8e8a88'); gr.addColorStop(1, '#9a9690');
  g.fillStyle = gr; g.fillRect(0, 0, 2, 256);
  const t = new THREE.CanvasTexture(c); t.colorSpace = THREE.SRGBColorSpace;
  scene.background = t;
}

const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 400);

// ---------- 조명 (해 질 녘) ----------
scene.add(new THREE.HemisphereLight(0xb8c0d0, 0x3a3a40, 1.4));
const sun = new THREE.DirectionalLight(0xd8c8b8, 0.9);
sun.position.set(-30, 18, 25);
sun.castShadow = true;
sun.shadow.mapSize.set(isTouch ? 1024 : 2048, isTouch ? 1024 : 2048);
Object.assign(sun.shadow.camera, { left: -30, right: 30, top: 30, bottom: -30, near: 1, far: 100 });
sun.shadow.bias = -0.0005;
scene.add(sun, sun.target);

// 해
const sunDisk = new THREE.Mesh(new THREE.CircleGeometry(9, 32), new THREE.MeshBasicMaterial({ color: 0xffe0a0, fog: false }));
sunDisk.position.set(-150, 22, 140); sunDisk.lookAt(0, 0, 0); // 비 오는 날: 해는 숨김

// 빗줄기 (캐릭터 주변을 따라다님)
const RAIN_N = isTouch ? 1500 : 3000, RAIN_R = 25;
const rainPos = new Float32Array(RAIN_N * 6);
for (let i = 0; i < RAIN_N; i++) {
  const x = (Math.random() - .5) * RAIN_R * 2, y = Math.random() * 20, z = (Math.random() - .5) * RAIN_R * 2;
  rainPos.set([x, y, z, x + 0.05, y - 0.6, z], i * 6);
}
const rainGeo = new THREE.BufferGeometry(); rainGeo.setAttribute('position', new THREE.BufferAttribute(rainPos, 3));
const rain = new THREE.LineSegments(rainGeo, new THREE.LineBasicMaterial({ color: 0xc8d0dc, transparent: true, opacity: 0.45, fog: false }));
rain.frustumCulled = false; scene.add(rain);
// 물웅덩이
const puddleMat = new THREE.MeshLambertMaterial({ color: 0x5a6068, transparent: true, opacity: 0.55 });
for (let i = 0; i < 25; i++) {
  const p = new THREE.Mesh(new THREE.CircleGeometry(0.5 + Math.random() * 1.2, 16), puddleMat);
  p.rotation.x = -Math.PI / 2; p.scale.y = 0.6 + Math.random() * 0.4;
  p.position.set((Math.random() - .5) * 24, 0.03, Math.random() * 30 - 4); p.receiveShadow = true; scene.add(p);
}

// ---------- 헬퍼 ----------
const M = (color, o = {}) => new THREE.MeshLambertMaterial({ color, ...o });
function mesh(geo, mat, x = 0, y = 0, z = 0, parent = scene, shadow = true) {
  const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z);
  if (shadow) { m.castShadow = true; m.receiveShadow = true; }
  parent.add(m); return m;
}
const boxes = [];   // AABB 충돌체
const circles = []; // 원형 충돌체
const addBox = (x1, x2, z1, z2) => boxes.push({ x1, x2, z1, z2 });

// ---------- 지면 ----------
const ground = mesh(new THREE.PlaneGeometry(240, 240), M(0x4a4e32), 0, 0, 0, scene, false);
ground.rotation.x = -Math.PI / 2; ground.receiveShadow = true;
// 마당(흙)
const yard = mesh(new THREE.CircleGeometry(16, 40), M(0x7a6650), 0, 0.01, -2, scene, false);
yard.rotation.x = -Math.PI / 2; yard.receiveShadow = true;
// 돌길
const stoneMat = M(0x9a948a);
for (let z = 30; z > -5; z -= 1.3) {
  const s = mesh(new THREE.BoxGeometry(1.6 + Math.random() * 0.4, 0.08, 1.0), stoneMat, (Math.random() - .5) * .2, 0.04, z, scene, false);
  s.receiveShadow = true; s.rotation.y = (Math.random() - .5) * .15;
}

// ---------- 법당 ----------
const HALL = { x1: -8, x2: 8, z1: -20, z2: -8, h: 0.8 };
const hall = new THREE.Group(); scene.add(hall);
const woodMat = M(0x8a3a24), wallMat = M(0xe8dcc0), dancheong = M(0x2f7a6a), roofMat = M(0x3d3f45), baseMat = M(0x8f8a80);
// 기단
mesh(new THREE.BoxGeometry(16, 0.8, 12), baseMat, 0, 0.4, -14, hall);
// 돌계단
for (let i = 0; i < 4; i++) mesh(new THREE.BoxGeometry(6, 0.2 * (i + 1), 0.6), baseMat, 0, 0.1 * (i + 1), -5.9 - i * 0.6, hall);
// 바닥(마루)
mesh(new THREE.BoxGeometry(14, 0.05, 10), M(0x7a5232), 0, 0.83, -14, hall);
// 벽
mesh(new THREE.BoxGeometry(14, 4, 0.3), wallMat, 0, 2.8, -19, hall);
mesh(new THREE.BoxGeometry(0.3, 4, 10), wallMat, -7, 2.8, -14, hall);
mesh(new THREE.BoxGeometry(0.3, 4, 10), wallMat, 7, 2.8, -14, hall);
mesh(new THREE.BoxGeometry(5, 4, 0.3), wallMat, -4.5, 2.8, -9, hall);
mesh(new THREE.BoxGeometry(5, 4, 0.3), wallMat, 4.5, 2.8, -9, hall);
mesh(new THREE.BoxGeometry(4, 1, 0.3), wallMat, 0, 4.3, -9, hall);
// 문살 무늬(앞벽)
for (const sx of [-1, 1]) for (let i = 0; i < 4; i++)
  mesh(new THREE.BoxGeometry(0.9, 2.6, 0.05), M(0xc48a50), sx * (3 + i * 1.05), 2.5, -8.83, hall, false);
// 기둥
for (const x of [-7, -2, 2, 7]) for (const z of [-9, -19])
  mesh(new THREE.CylinderGeometry(0.25, 0.28, 4.2, 10), woodMat, x, 2.9, z + (z === -9 ? 0.15 : 0), hall);
// 단청 띠
mesh(new THREE.BoxGeometry(14.6, 0.4, 10.6), dancheong, 0, 4.95, -14, hall);
// 기와지붕
const roof = new THREE.Group(); hall.add(roof);
{
  const r = mesh(new THREE.ConeGeometry(1, 1, 4, 1, true), roofMat, 0, 6.6, -14, roof);
  r.rotation.y = Math.PI / 4; r.scale.set(13.5, 3.2, 9.5); r.material.side = THREE.DoubleSide;
  // 처마
  mesh(new THREE.BoxGeometry(19.5, 0.25, 14.5), roofMat, 0, 5.15, -14, roof);
  // 용마루
  mesh(new THREE.BoxGeometry(6, 0.45, 0.5), M(0x2b2c30), 0, 8.15, -14, roof);
  // 기와 골
  for (let x = -9; x <= 9; x += 0.75) {
    mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.6, 5), M(0x2b2c30), x, 5.4, -6.9, roof, false).rotation.x = Math.PI / 2 - 0.4;
    mesh(new THREE.CylinderGeometry(0.09, 0.09, 1.6, 5), M(0x2b2c30), x, 5.4, -21.1, roof, false).rotation.x = Math.PI / 2 + 0.4;
  }
  // 추녀 끝 들림 + 풍경
  for (const sx of [-1, 1]) for (const sz of [-1, 1]) {
    const tip = mesh(new THREE.ConeGeometry(0.25, 1.4, 6), roofMat, sx * 9.7, 5.55, -14 + sz * 7.2, roof);
    tip.rotation.z = -sx * 0.9; tip.rotation.x = sz * 0.5;
    const bell = mesh(new THREE.CylinderGeometry(0.08, 0.18, 0.35, 8), M(0x6e5a2a), sx * 9.4, 4.6, -14 + sz * 7, roof);
    mesh(new THREE.BoxGeometry(0.02, 0.4, 0.02), M(0x333333), sx * 9.4, 4.95, -14 + sz * 7, roof, false);
    const fish = mesh(new THREE.BoxGeometry(0.04, 0.15, 0.3), M(0x8a7a3a), 0, -0.35, 0, bell, false);
    bell.userData.fish = fish;
  }
}
// 불상
const gold = M(0xd4a640, { emissive: 0x3a2508 });
mesh(new THREE.BoxGeometry(3, 1.2, 2.2), M(0x6a2a1e), 0, 1.4, -17.7, hall);
// 연화대: 받침 + 둘레 연꽃잎
mesh(new THREE.CylinderGeometry(1.25, 1.1, 0.35, 20), M(0xb04848), 0, 2.15, -17.7, hall);
for (let i = 0; i < 14; i++) {
  const a = i / 14 * Math.PI * 2;
  const leaf = mesh(new THREE.SphereGeometry(0.3, 8, 6), M(0xd86a70), Math.sin(a) * 1.2, 2.3, -17.7 + Math.cos(a) * 1.2, hall, false);
  leaf.scale.set(0.8, 0.5, 0.35); leaf.rotation.y = a;
}
{
  // 결가부좌한 금동 좌불 (정면 = +z)
  const b = new THREE.Group(); b.position.set(0, 2.35, -17.7); b.scale.setScalar(0.8); hall.add(b);
  const hair = M(0x2a3550), dk = M(0x3a2a10);
  mesh(new THREE.SphereGeometry(1, 20, 12), gold, 0, 0.3, 0.05, b).scale.set(1.15, 0.33, 0.75);   // 무릎 받침
  for (const sx of [-1, 1]) {                                                                   // 엇갈린 정강이
    const shin = mesh(new THREE.CapsuleGeometry(0.24, 1.3, 4, 10), gold, sx * 0.08, 0.42, 0.35 - sx * 0.08, b);
    shin.rotation.z = Math.PI / 2; shin.rotation.y = sx * 0.18;
  }
  const torso = mesh(new THREE.CylinderGeometry(0.5, 0.68, 1.3, 18), gold, 0, 1.15, 0, b); torso.scale.z = 0.72;
  mesh(new THREE.SphereGeometry(0.62, 18, 10), gold, 0, 1.75, 0, b).scale.set(1.12, 0.5, 0.75);  // 어깨
  for (const sx of [-1, 1]) {
    const up = mesh(new THREE.CapsuleGeometry(0.17, 0.6, 4, 8), gold, sx * 0.68, 1.4, 0.05, b); up.rotation.z = sx * 0.15;
    const fore = mesh(new THREE.CapsuleGeometry(0.14, 0.5, 4, 8), gold, sx * 0.45, 0.85, 0.35, b);
    fore.rotation.z = sx * 1.2; fore.rotation.x = 0.4;
  }
  mesh(new THREE.SphereGeometry(0.28, 12, 8), gold, 0, 0.72, 0.5, b).scale.set(1.3, 0.4, 0.85);  // 선정인 손
  mesh(new THREE.CylinderGeometry(0.17, 0.2, 0.25, 12), gold, 0, 2.0, 0, b);                     // 목
  const head = mesh(new THREE.SphereGeometry(0.42, 20, 16), gold, 0, 2.38, 0, b); head.scale.set(0.95, 1.08, 0.95);
  mesh(new THREE.SphereGeometry(0.44, 20, 10, 0, Math.PI * 2, 0, Math.PI * 0.42), hair, 0, 2.45, -0.02, b); // 나발
  mesh(new THREE.SphereGeometry(0.22, 14, 10), hair, 0, 2.86, -0.02, b);                         // 육계
  for (const sx of [-1, 1]) {
    mesh(new THREE.SphereGeometry(0.17, 10, 8), gold, sx * 0.41, 2.25, -0.02, b).scale.set(0.35, 1.25, 0.6); // 긴 귀
    mesh(new THREE.BoxGeometry(0.14, 0.025, 0.02), dk, sx * 0.14, 2.38, 0.39, b, false);         // 감은 눈
  }
  mesh(new THREE.SphereGeometry(0.035, 6, 4), M(0xfff0c0, { emissive: 0x806020 }), 0, 2.5, 0.4, b, false); // 백호
  mesh(new THREE.BoxGeometry(0.12, 0.02, 0.02), M(0x8a3a20), 0, 2.17, 0.38, b, false);          // 입
  const haloMat = M(0xe8b850, { emissive: 0x5a3a08, side: THREE.DoubleSide });
  mesh(new THREE.CircleGeometry(0.75, 32), haloMat, 0, 2.4, -0.45, b, false);                    // 두광
  const body2 = mesh(new THREE.CircleGeometry(1, 32), M(0xb8862e, { emissive: 0x3a2508, side: THREE.DoubleSide }), 0, 1.35, -0.55, b, false);
  body2.scale.set(1.25, 1.6, 1);                                                                 // 신광
}
// 촛대
const candleLight = new THREE.PointLight(0xffaa55, 6, 12, 1.5); candleLight.position.set(0, 3, -15.8); hall.add(candleLight);
for (const x of [-1.2, 1.2]) {
  mesh(new THREE.CylinderGeometry(0.06, 0.06, 0.5, 6), M(0xf5f0e0), x, 2.25, -16.4, hall, false);
  mesh(new THREE.SphereGeometry(0.06, 6, 4), new THREE.MeshBasicMaterial({ color: 0xffcc66 }), x, 2.55, -16.4, hall, false);
}
// 방석
const CUSHION = new THREE.Vector3(0, 0.85, -14.6);
mesh(new THREE.CylinderGeometry(0.7, 0.75, 0.18, 16), M(0x9a3a3a), CUSHION.x, 0.92, CUSHION.z, hall);
// 목탁
mesh(new THREE.SphereGeometry(0.22, 12, 8), M(0x8a5a2a), 0.8, 1.0, -14.4, hall).scale.set(1, 0.8, 1.1);

// 법당 충돌
addBox(-7.2, 7.2, -19.3, -18.7); addBox(-7.2, -6.8, -19.3, -8.7); addBox(6.8, 7.2, -19.3, -8.7);
addBox(-7.2, -2, -9.25, -8.75); addBox(2, 7.2, -9.25, -8.75);
addBox(-1.6, 1.6, -18.9, -16.5);
addBox(-8.2, -3, -8.2, -7.8); addBox(3, 8.2, -8.2, -7.8); addBox(-8.2, -7.8, -20.2, -8); addBox(7.8, 8.2, -20.2, -8); addBox(-8.2, 8.2, -20.2, -19.8);

function groundHeight(x, z) {
  if (x > HALL.x1 && x < HALL.x2 && z > HALL.z1 && z < HALL.z2) return HALL.h;
  if (Math.abs(x) < 3 && z >= -8 && z < -5.6) return HALL.h * (-5.6 - z) / 2.4;
  return 0;
}

// ---------- 석등 ----------
function lantern(x, z) {
  const g = new THREE.Group(); g.position.set(x, 0, z); scene.add(g);
  const s = M(0xa8a298);
  mesh(new THREE.CylinderGeometry(0.6, 0.7, 0.3, 8), s, 0, 0.15, 0, g);
  mesh(new THREE.CylinderGeometry(0.18, 0.22, 1.4, 8), s, 0, 1.0, 0, g);
  mesh(new THREE.CylinderGeometry(0.5, 0.4, 0.2, 8), s, 0, 1.8, 0, g);
  mesh(new THREE.BoxGeometry(0.6, 0.6, 0.6), new THREE.MeshBasicMaterial({ color: 0xffc070 }), 0, 2.2, 0, g, false);
  for (const a of [0, 1, 2, 3]) mesh(new THREE.BoxGeometry(0.12, 0.6, 0.12), s, Math.cos(a * Math.PI / 2 + Math.PI / 4) * 0.38, 2.2, Math.sin(a * Math.PI / 2 + Math.PI / 4) * 0.38, g);
  const cap = mesh(new THREE.ConeGeometry(0.75, 0.5, 8), s, 0, 2.75, 0, g);
  mesh(new THREE.SphereGeometry(0.13, 8, 6), s, 0, 3.05, 0, g);
  circles.push({ x, z, r: 0.6 });
}
lantern(-3, -3); lantern(3, -3); lantern(-3, 4); lantern(3, 4);

// 석탑
{
  const g = new THREE.Group(); g.position.set(-8, 0, 2); scene.add(g);
  const s = M(0x9d978c); let y = 0;
  mesh(new THREE.BoxGeometry(2.4, 0.6, 2.4), s, 0, 0.3, 0, g); y = 0.6;
  for (let i = 0; i < 3; i++) {
    const w = 1.3 - i * 0.2;
    mesh(new THREE.BoxGeometry(w, 0.8 - i * 0.15, w), s, 0, y + 0.4 - i * 0.07, 0, g); y += 0.8 - i * 0.15;
    mesh(new THREE.BoxGeometry(w + 0.8, 0.18, w + 0.8), s, 0, y + 0.09, 0, g); y += 0.18;
  }
  mesh(new THREE.CylinderGeometry(0.06, 0.06, 1, 6), M(0x5a5040), 0, y + 0.5, 0, g);
  circles.push({ x: -8, z: 2, r: 1.4 });
}

// ---------- 소나무 숲 ----------
const trunkGeo = new THREE.CylinderGeometry(0.18, 0.3, 1, 7);
const needleGeo = new THREE.ConeGeometry(1, 1, 8);
const trunkMat = M(0x6a3e28), needleMats = [M(0x2f4a2c), M(0x3a5530), M(0x284026)];
function pine(x, z, s) {
  const g = new THREE.Group(); g.position.set(x, 0, z); g.rotation.y = Math.random() * 6; scene.add(g);
  const h = 4 * s;
  const t = mesh(trunkGeo, trunkMat, 0, h / 2, 0, g); t.scale.set(s, h, s); t.rotation.z = (Math.random() - .5) * .15;
  const mat = needleMats[(Math.random() * 3) | 0];
  for (let i = 0; i < 3; i++) {
    const c = mesh(needleGeo, mat, (Math.random() - .5) * .6 * s, h + i * 1.1 * s - 0.6 * s, (Math.random() - .5) * .6 * s, g);
    c.scale.set((2.2 - i * 0.55) * s, 1.6 * s, (1.9 - i * 0.5) * s);
  }
  circles.push({ x, z, r: 0.45 * s });
}
const BOUND = 34;
for (let i = 0; i < 140; i++) {
  const a = Math.random() * Math.PI * 2, r = 17 + Math.random() * 26;
  const x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (Math.abs(x) < 3 && z > 0) continue; // 진입로
  if (x > -11 && x < 11 && z > -24 && z < -4) continue; // 법당
  pine(x, z, 0.8 + Math.random() * 0.6);
}

// ---------- 먼 산 (겹겹이) ----------
const layers = [
  { d: 75, col: 0x5a5e60, h: 26, n: 18 },
  { d: 110, col: 0x6e7274, h: 38, n: 16 },
  { d: 150, col: 0x828584, h: 50, n: 14 },
  { d: 200, col: 0x92938f, h: 65, n: 12 },
];
for (const L of layers) {
  const mat = new THREE.MeshBasicMaterial({ color: L.col, fog: false });
  for (let i = 0; i < L.n; i++) {
    const a = (i / L.n) * Math.PI * 2 + Math.random() * 0.3;
    const h = L.h * (0.6 + Math.random() * 0.6);
    const m = mesh(new THREE.ConeGeometry(L.d * 0.35, h, 6), mat, Math.cos(a) * L.d, h / 2 - 2, Math.sin(a) * L.d, scene, false);
    m.rotation.y = Math.random();
  }
}
// 옅은 안개 띠
{
  const fogMat = new THREE.MeshBasicMaterial({ color: 0xa8a8a8, transparent: true, opacity: 0.45, fog: false, depthWrite: false, side: THREE.DoubleSide });
  for (const [r, y] of [[90, 6], [130, 10], [175, 14]]) {
    mesh(new THREE.CylinderGeometry(r, r, 10, 40, 1, true), fogMat, 0, y, 0, scene, false);
  }
}

// ---------- 동자승 ----------
const player = new THREE.Group(); scene.add(player);
const body = new THREE.Group(); player.add(body);
const robe = M(0x8a8a88), skin = M(0xf2cfa8), dark = M(0x4a4a4a);
mesh(new THREE.CylinderGeometry(0.28, 0.42, 0.75, 12), robe, 0, 0.85, 0, body);
mesh(new THREE.BoxGeometry(0.5, 0.06, 0.32), M(0x6a6a68), 0, 0.92, 0.05, body, false); // 띠
const head = mesh(new THREE.SphereGeometry(0.34, 18, 14), skin, 0, 1.52, 0, body);
for (const x of [-0.11, 0.11]) mesh(new THREE.SphereGeometry(0.035, 6, 4), M(0x222222), x, 1.55, 0.31, body, false);
mesh(new THREE.SphereGeometry(0.06, 6, 4), M(0xf0a090), 0.18, 1.45, 0.27, body, false);
mesh(new THREE.SphereGeometry(0.06, 6, 4), M(0xf0a090), -0.18, 1.45, 0.27, body, false);
for (const x of [-0.34, 0.34]) mesh(new THREE.SphereGeometry(0.08, 8, 6), skin, x, 1.52, 0, body, false);
function limb(x, y, len, rad, mat, handMat) {
  const p = new THREE.Group(); p.position.set(x, y, 0); body.add(p);
  mesh(new THREE.CylinderGeometry(rad, rad * 0.9, len, 8), mat, 0, -len / 2, 0, p);
  mesh(new THREE.SphereGeometry(rad * 1.05, 8, 6), handMat, 0, -len, 0, p);
  return p;
}
const armL = limb(-0.36, 1.15, 0.5, 0.09, robe, skin), armR = limb(0.36, 1.15, 0.5, 0.09, robe, skin);
const legL = limb(-0.14, 0.5, 0.45, 0.1, robe, dark), legR = limb(0.14, 0.5, 0.45, 0.1, robe, dark);
player.position.set(0, 0, 14);
player.rotation.y = Math.PI;

// ---------- 입력 ----------
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; });
addEventListener('keyup', e => { keys[e.code] = false; });
// 화면 방향키: 누르고 있는 동안 키보드 방향키와 똑같이 동작 (여러 손가락 동시 입력 가능)
if (isTouch) document.getElementById('hint').style.display = 'none';
for (const btn of document.querySelectorAll('#pad button')) {
  const k = btn.dataset.k;
  const down = e => { e.preventDefault(); try { btn.setPointerCapture(e.pointerId); } catch {} keys[k] = true; btn.classList.add('on'); };
  const up = () => { keys[k] = false; btn.classList.remove('on'); };
  btn.addEventListener('pointerdown', down);
  btn.addEventListener('pointerup', up); btn.addEventListener('pointercancel', up); btn.addEventListener('lostpointercapture', up);
  btn.addEventListener('contextmenu', e => e.preventDefault());
}

// ---------- 오디오: 녹음된 빗소리 하나만 반복 재생 ----------
const rainAudio = new Audio('rain%20sound/rain%20sound.wav');
rainAudio.loop = true; rainAudio.volume = 0.8;
let soundOn = true;
const soundBtn = document.getElementById('sound');
function initAudio() { if (soundOn && rainAudio.paused) rainAudio.play().catch(() => {}); }
['pointerdown', 'keydown', 'touchstart'].forEach(ev => addEventListener(ev, initAudio, { passive: true }));
soundBtn.addEventListener('click', e => {
  e.stopPropagation();
  soundOn = !soundOn; soundBtn.textContent = soundOn ? '🔊' : '🔇';
  if (soundOn) rainAudio.play().catch(() => {}); else rainAudio.pause();
});

// ---------- 앉기 ----------
const sitBtn = document.getElementById('sit');
let sitting = false, sitT = 0;
sitBtn.addEventListener('click', e => {
  e.stopPropagation(); initAudio();
  sitting = !sitting;
  if (sitting) {
    player.position.set(CUSHION.x, CUSHION.y, CUSHION.z);
    player.rotation.y = Math.PI;
  }
  sitBtn.textContent = sitting ? '일어나기' : '앉기';
});

// ---------- 충돌 ----------
const PR = 0.4;
function collide(p) {
  for (const b of boxes) {
    const cx = Math.max(b.x1, Math.min(p.x, b.x2)), cz = Math.max(b.z1, Math.min(p.z, b.z2));
    const dx = p.x - cx, dz = p.z - cz, d2 = dx * dx + dz * dz;
    if (d2 < PR * PR) {
      if (d2 > 1e-8) { const d = Math.sqrt(d2); p.x = cx + dx / d * PR; p.z = cz + dz / d * PR; }
      else { // 안쪽에 박힌 경우
        const opts = [[p.x - b.x1 + PR, -1, 0], [b.x2 - p.x + PR, 1, 0], [p.z - b.z1 + PR, 0, -1], [b.z2 - p.z + PR, 0, 1]].sort((a, c) => a[0] - c[0])[0];
        p.x += opts[1] * opts[0]; p.z += opts[2] * opts[0];
      }
    }
  }
  for (const c of circles) {
    const dx = p.x - c.x, dz = p.z - c.z, d = Math.hypot(dx, dz), m = c.r + PR;
    if (d < m && d > 1e-6) { p.x = c.x + dx / d * m; p.z = c.z + dz / d * m; }
  }
  const r = Math.hypot(p.x, p.z);
  if (r > BOUND) { p.x *= BOUND / r; p.z *= BOUND / r; }
}

// ---------- 루프 ----------
let camYaw = 0, walkPhase = 0, swingBells = 0;
const camPos = new THREE.Vector3(0, 4, 20), lookAt = new THREE.Vector3();
const clock = new THREE.Clock();
const bells = []; roof.traverse(o => o.userData.fish && bells.push(o));

function lerpAngle(a, b, t) { let d = ((b - a + Math.PI) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2) - Math.PI; return a + d * t; }

function tick() {
  const dt = Math.min(clock.getDelta(), 0.05), time = clock.elapsedTime;
  let ix = 0, iz = 0;
  if (keys.KeyW || keys.ArrowUp) iz -= 1;
  if (keys.KeyS || keys.ArrowDown) iz += 1;
  if (keys.KeyA || keys.ArrowLeft) ix -= 1;
  if (keys.KeyD || keys.ArrowRight) ix += 1;
  let mag = Math.min(1, Math.hypot(ix, iz));

  if (sitting) {
    mag = 0; sitT = Math.min(1, sitT + dt * 3);
  } else sitT = Math.max(0, sitT - dt * 3);

  if (mag > 0.1) {
    const n = Math.hypot(ix, iz); ix /= n; iz /= n;
    // 카메라 기준 방향
    const sin = Math.sin(camYaw), cos = Math.cos(camYaw);
    const wx = ix * cos + iz * sin, wz = -ix * sin + iz * cos;
    const speed = 4.2 * mag;
    player.position.x += wx * speed * dt; player.position.z += wz * speed * dt;
    collide(player.position);
    const face = Math.atan2(wx, wz);
    player.rotation.y = lerpAngle(player.rotation.y, face, Math.min(1, dt * 10));
    camYaw = lerpAngle(camYaw, face + Math.PI, Math.min(1, dt * 0.8 * Math.max(0, -iz + 0.3)));
    walkPhase += dt * 10 * mag;
  } else walkPhase *= 0.9;

  if (!sitting) {
    const gy = groundHeight(player.position.x, player.position.z);
    player.position.y += (gy - player.position.y) * Math.min(1, dt * 15);
  }

  // 팔다리
  const sw = Math.sin(walkPhase) * 0.7 * (mag > 0.1 ? 1 : 0);
  const s = sitT;
  legL.rotation.x = THREE.MathUtils.lerp(sw, -1.5, s);
  legR.rotation.x = THREE.MathUtils.lerp(-sw, -1.5, s);
  legL.rotation.z = THREE.MathUtils.lerp(0, -0.5, s); legR.rotation.z = THREE.MathUtils.lerp(0, 0.5, s);
  armL.rotation.x = THREE.MathUtils.lerp(-sw, -1.35, s);
  armR.rotation.x = THREE.MathUtils.lerp(sw, -1.35, s);
  armL.rotation.z = THREE.MathUtils.lerp(0, -0.55, s); armR.rotation.z = THREE.MathUtils.lerp(0, 0.55, s);
  body.position.y = THREE.MathUtils.lerp(Math.abs(Math.sin(walkPhase)) * 0.06, -0.4, s);
  head.rotation.x = s * 0.15 + (sitting ? Math.sin(time * 1.5) * 0.03 : 0);

  // 앉기 버튼
  const near = player.position.distanceTo(new THREE.Vector3(CUSHION.x, player.position.y, CUSHION.z)) < 1.8;
  sitBtn.style.display = (near || sitting) ? 'block' : 'none';

  // 법당 안이면 지붕 숨김
  const p = player.position;
  roof.visible = !(p.x > -7 && p.x < 7 && p.z > -19 && p.z < -9);

  // 비: 떨어지고 캐릭터 주변으로 순환. 법당 안은 빗소리 작게
  const rp = rainGeo.attributes.position.array, fall = dt * 22;
  for (let i = 0; i < rp.length; i += 6) {
    rp[i + 1] -= fall; rp[i + 4] -= fall;
    if (rp[i + 4] < 0) { rp[i + 1] += 20; rp[i + 4] += 20; }
  }
  rainGeo.attributes.position.needsUpdate = true; rain.visible = roof.visible;
  rain.position.set(Math.round(p.x / 2) * 2, 0, Math.round(p.z / 2) * 2);
  rainAudio.volume += ((roof.visible ? 0.8 : 0.45) - rainAudio.volume) * Math.min(1, dt * 2); // 법당 안은 작게

  // 풍경 흔들림
  swingBells = Math.max(0, swingBells - dt);
  for (const b of bells) b.rotation.z = Math.sin(time * 6 + b.position.x) * 0.25 * swingBells;
  candleLight.intensity = 5.5 + Math.sin(time * 13) * 0.4 + Math.sin(time * 7.3) * 0.4;

  // 카메라
  const inside = !roof.visible;
  const dist = sitting ? 3.6 : inside ? 4 : 6, hgt = sitting ? 2.2 : inside ? 2.4 : 3.2;
  const target = new THREE.Vector3(p.x + Math.sin(camYaw) * dist, p.y + hgt, p.z + Math.cos(camYaw) * dist);
  if (inside) { target.x = Math.max(-6.5, Math.min(6.5, target.x)); target.z = Math.max(-18.5, target.z); }
  camPos.lerp(target, Math.min(1, dt * 4));
  camera.position.copy(camPos);
  lookAt.lerp(new THREE.Vector3(p.x, p.y + (sitting ? 1.9 : 1.1), p.z - (sitting ? 1.5 : 0)), Math.min(1, dt * 8));
  camera.lookAt(lookAt);

  // 그림자 카메라를 캐릭터 따라
  sun.position.set(p.x - 30, 18, p.z + 25); sun.target.position.set(p.x, 0, p.z - 5);

  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
lookAt.set(0, 1, 14);
tick();

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.fov = innerWidth < innerHeight ? 72 : 60; // 세로 화면은 넓게
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
dispatchEvent(new Event('resize'));
</script>
</body>
</html>
